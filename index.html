<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <meta name="color-scheme" content="light">
  <title>对话主页 · 稀土材料科学平台（静态演示 Demo v3.60）</title>
  <link rel="stylesheet" href="assets/style.css?v=3.60">
</head>
<body data-page="index">
  <div class="app-shell">
    <!-- v3.0（D-38）：#app-chrome 由 renderChrome() 一处注入「唯一左侧边栏」（无顶栏）；
         对话即页面：#page-root 由 initIndex() 渲染整页对话（hero 空态 / 会话流 / 底部输入条）。
         ?q= 并入当前会话；?c=<会话ID> 打开历史会话；?focus=1 聚焦输入框。 -->
    <div id="app-chrome"></div>
    <main id="page-root"></main>
  </div>
  <!-- 抽屉 / toast 容器 -->
  <div id="overlays"></div>
  <noscript><div style="padding:24px;font-family:sans-serif;color:#B91C1C">本 Demo 需要启用 JavaScript 才能渲染界面（纯静态、无网络请求）。</div></noscript>

  <!-- 传统脚本（非 ES module），保证 file:// 双击可运行；mock-data.js 必须先于 app.js -->
  <script src="assets/mock-data.js?v=3.60"></script>
  <script src="assets/app.js?v=3.60"></script>
</body>
</html>
