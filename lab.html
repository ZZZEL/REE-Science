  <title>实验中心 · 稀土材料科学平台（静态演示 Demo v3.78）</title>

<body data-page="lab">

  </div>
  <div id="overlays"></div>
  <noscript><div style="padding:24px;font-family:sans-serif;color:#B91C1C">本 Demo 需要启用 JavaScript 才能渲染界面（纯静态、无网络请求）。</div></noscript>

  <!-- 传统脚本（非 ES module），保证 file:// 双击可运行；mock-data.js 必须先于 app.js -->
